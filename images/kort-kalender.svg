<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <!-- Bakgrunn i varm sandfarge -->
  <rect width="600" height="400" fill="#D4AA9D" rx="12"/>

  <!-- Lys sirkel i midten -->
  <circle cx="300" cy="200" r="140" fill="#FAF8F5" opacity="0.4"/>

  <!-- Bue-ramme -->
  <path d="M220,290 L220,170 C220,130 250,90 300,70 C350,90 380,130 380,170 L380,290 Z" 
        fill="none" stroke="#542314" stroke-width="4"/>

  <!-- Kalender-kropp -->
  <rect x="235" y="140" width="130" height="110" rx="8" fill="#FAF8F5" stroke="#14532D" stroke-width="3"/>
  <!-- Kalender-topp (Skogsgrønn) -->
  <path d="M235,148 C235,143 239,140 244,140 L356,140 C361,140 365,143 365,148 L365,170 L235,170 Z" fill="#14532D"/>

  <!-- Kalender-hengere -->
  <rect x="260" y="130" width="8" height="15" rx="3" fill="#542314"/>
  <rect x="332" y="130" width="8" height="15" rx="3" fill="#542314"/>

  <!-- Rutenett med bønne-/event-dager -->
  <circle cx="260" cy="190" r="6" fill="#9DD4B3"/>
  <circle cx="285" cy="190" r="6" fill="#14532D"/>
  <circle cx="310" cy="190" r="6" fill="#14532D"/>
  <circle cx="335" cy="190" r="7" fill="#54142D"/> <!-- Markert event (Burgunder) -->

  <circle cx="260" cy="215" r="6" fill="#14532D"/>
  <circle cx="285" cy="215" r="6" fill="#14532D"/>
  <circle cx="310" cy="215" r="6" fill="#9DD4B3"/>
  <circle cx="335" cy="215" r="6" fill="#14532D"/>
</svg>
