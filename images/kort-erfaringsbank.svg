<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <!-- Bakgrunn i varm sandfarge -->
  <rect width="600" height="400" fill="#D4AA9D" rx="12"/>

  <!-- Lys sirkel i midten -->
  <circle cx="300" cy="200" r="140" fill="#FAF8F5" opacity="0.4"/>

  <!-- Bue-ramme -->
  <path d="M220,290 L220,170 C220,130 250,90 300,70 C350,90 380,130 380,170 L380,290 Z" 
        fill="none" stroke="#542314" stroke-width="4"/>

  <!-- Kunnskaps-tre / Nettverk-ikon -->
  <!-- Stamme -->
  <path d="M295,250 L305,250 L305,200 L295,200 Z" fill="#542314"/>
  <!-- Røtter -->
  <path d="M285,255 C295,250 305,250 315,255" stroke="#542314" stroke-width="3" fill="none"/>

  <!-- Forgreininger & Noder (Fellesskap) -->
  <line x1="300" y1="200" x2="260" y2="165" stroke="#14532D" stroke-width="3"/>
  <line x1="300" y1="200" x2="340" y2="165" stroke="#14532D" stroke-width="3"/>
  <line x1="300" y1="180" x2="300" y2="140" stroke="#14532D" stroke-width="3"/>

  <!-- Løv / Noder -->
  <circle cx="300" cy="135" r="16" fill="#14532D"/>
  <circle cx="300" cy="135" r="7" fill="#9DD4B3"/>

  <circle cx="255" cy="160" r="14" fill="#54142D"/>
  <circle cx="255" cy="160" r="6" fill="#FAF8F5"/>

  <circle cx="345" cy="160" r="14" fill="#14532D"/>
  <circle cx="345" cy="160" r="6" fill="#9DD4B3"/>
</svg>
