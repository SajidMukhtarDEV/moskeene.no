        fill="none" stroke="#542314" stroke-width="4"/>

  <!-- Dialogboble 1 (Skogsgrønn) -->
  <path d="M220,150 C220,125 245,110 275,110 C305,110 330,125 330,150 C330,165 320,180 305,185 L300,205 L285,190 C245,190 220,175 220,150 Z" 
        fill="#14532D" opacity="0.95"/>

  <!-- Dialogboble 2 (Burgunder aksent) -->
