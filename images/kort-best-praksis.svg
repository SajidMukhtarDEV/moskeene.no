<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <!-- Bakgrunn i varm sandfarge -->
  <rect width="600" height="400" fill="#D4AA9D" rx="12"/>
  
  <!-- Subtilt mønster / lys sirkel -->
  <circle cx="300" cy="200" r="140" fill="#FAF8F5" opacity="0.4"/>

  <!-- Bue-ramme (Islamsk bue) -->
  <path d="M220,290 L220,170 C220,130 250,90 300,70 C350,90 380,130 380,170 L380,290 Z" 
        fill="none" stroke="#542314" stroke-width="4"/>

  <!-- Bok-ikon (Kunnskap & Best praksis) -->
  <!-- Venstre side av bok -->
  <path d="M300,180 C270,165 240,165 210,175 L210,245 C240,235 270,235 300,250 Z" 
        fill="#14532D" stroke="#14532D" stroke-width="2"/>
  <!-- Høyre side av bok -->
  <path d="M300,180 C330,165 360,165 390,175 L390,245 C360,235 330,235 300,250 Z" 
        fill="#14532D" stroke="#14532D" stroke-width="2"/>

  <!-- Bokrygg / lysstråle i midten -->
  <line x1="300" y1="180" x2="300" y2="250" stroke="#9DD4B3" stroke-width="4"/>

  <!-- Stjerne / gnist over boken (Innovasjon) -->
  <polygon points="300,125 306,140 321,140 309,149 313,164 300,154 287,164 291,149 279,140 294,140" 
           fill="#54142D"/>
</svg>
